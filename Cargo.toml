[workspace]
members = ["core", "math", "diagram", "wasm", "android"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
# Pinned to a commit of the main branch: ==highlight== and CJK-friendly emphasis are not yet in a release.
pulldown-cmark = { git = "https://github.com/pulldown-cmark/pulldown-cmark", rev = "1c1a3123207d9e07fdfcf3d3418a047907185afb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.122"
