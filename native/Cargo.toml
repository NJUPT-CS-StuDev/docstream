[package]
name = "docstream-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = "~0.32.0"
docstream-core = { path = "../core" }
docstream-math = { path = "../math" }
docstream-diagram = { path = "../diagram" }
serde_json.workspace = true
